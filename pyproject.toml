[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pregnancysafe"
version = "0.1.0"
description = "RAG system for pregnancy-safe medication and symptom guidance, grounded in WHO/NICE/ACOG/FDA/MotherToBaby sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PregnancySafe Team" }]

dependencies = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "streamlit>=1.35.0",
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
llm = [
    "groq>=0.11.0",
]

[project.scripts]
pregnancysafe-ingest = "scripts.run_ingestion:main"
pregnancysafe-index = "scripts.build_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
